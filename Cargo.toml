[package]
name = "keyflow"
version = "0.2.0"
edition = "2024"

[dependencies]
egui = "0.31"
eframe = "0.31"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
parking_lot = "0.13"
once_cell = "1"
